services:
  papershooter:
    build:
      context: .
      target: app
      args:
        VITE_ICE_CONFIG_URL: /api/ice-servers
        VITE_TURN_CREDENTIALS_URL: ${VITE_TURN_CREDENTIALS_URL-/api/turn-credentials}
        VITE_PEER_HOST: ${VITE_PEER_HOST:-}
        VITE_PEER_PORT: ${VITE_PEER_PORT:-}
        VITE_PEER_PATH: ${VITE_PEER_PATH:-/}
        VITE_PEER_SECURE: ${VITE_PEER_SECURE:-true}
        VITE_LOBBY_NAMESPACE: ${VITE_LOBBY_NAMESPACE:-}
    image: papershooter:latest
    restart: unless-stopped
    init: true
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs: [/tmp]
    ports:
      - '127.0.0.1:${PAPERSHOOT_PORT:-8901}:8080'
    environment:
      TURN_PROVIDER: ${TURN_PROVIDER:-}
      TURN_TTL_SECONDS: ${TURN_TTL_SECONDS:-${CF_TURN_TTL_SECONDS:-3600}}
      CF_TURN_KEY_ID: ${CF_TURN_KEY_ID:-}
      CF_TURN_API_TOKEN: ${CF_TURN_API_TOKEN:-}
      TURN_URLS: ${TURN_URLS:-}
      TURN_SHARED_SECRET: ${TURN_SHARED_SECRET:-}
      PAPERSHOOT_STUN_SERVERS: ${PAPERSHOOT_STUN_SERVERS-stun:stun.cloudflare.com:3478}
      TRUST_PROXY: ${TRUST_PROXY:-false}
      TRUST_PROXY_HEADER: ${TRUST_PROXY_HEADER:-x-real-ip}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-}
